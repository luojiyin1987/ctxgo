name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify Codex live harness gate
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/smoke_live_codex_hooks.py
      - name: Verify release package
        run: bash scripts/smoke-package-release.sh
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
