name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Emit formatted session sources (bootstrap only)
        run: |
          gofmt -w session.go session_cli.go session_test.go
          echo '=== SESSION SOURCE BEGIN ==='
          cat session.go
          echo '=== SESSION SOURCE END ==='
          echo '=== SESSION CLI BEGIN ==='
          cat session_cli.go
          echo '=== SESSION CLI END ==='
          echo '=== SESSION TEST BEGIN ==='
          cat session_test.go
          echo '=== SESSION TEST END ==='
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
