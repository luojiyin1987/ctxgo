name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Bootstrap the module checksums; go.sum will be committed after dependency resolution.
      - name: Resolve Go dependencies
        run: |
          go mod tidy
          echo '=== GO.MOD BEGIN ==='
          cat go.mod
          echo '=== GO.MOD END ==='
          echo '=== GO.SUM BEGIN ==='
          cat go.sum
          echo '=== GO.SUM END ==='
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
