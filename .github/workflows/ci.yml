name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify dependency files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Print formatted file sources (bootstrap only)
        run: |
          gofmt -w file_index.go file_index_test.go
          echo '=== FORMATTED FILE INDEX BEGIN ==='
          cat file_index.go
          echo '=== FORMATTED FILE INDEX END ==='
          echo '=== FORMATTED FILE TEST BEGIN ==='
          cat file_index_test.go
          echo '=== FORMATTED FILE TEST END ==='
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
